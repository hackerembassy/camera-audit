listen: ":8080"

# Authentik sends users to this daemon. It forwards non-/audit paths to
# Frigate's authenticated port so Frigate enforces admin/viewer/custom roles.
frigate_url: "https://frigate:8971"

# Frigate's default generated certificate is self-signed and cannot be
# hostname-verified. This explicit exception is suitable only on the private
# Docker network. Prefer a valid certificate and set this to false.
frigate_tls_insecure_skip_verify: true
# With a verifiable private/public certificate instead use, as needed:
# frigate_tls_ca_file: "/config/frigate-ca.crt"
# frigate_tls_server_name: "frigate.example.org"

# Optional but recommended: set the same value as Frigate proxy.auth_secret.
# The daemon overwrites this header on both HTTP and WebSocket upstream calls.
frigate_proxy_secret: "${CAMERA_AUDIT_FRIGATE_PROXY_SECRET}"

# Direct base URL of Frigate's bundled go2rtc server. The daemon adds
# /api/streams and /api/streams.dot. Port 1984 should be reachable only on the
# private Docker network; do not publish it to an untrusted LAN.
go2rtc_url: "http://frigate:1984"
# These are go2rtc API credentials, not camera or Frigate credentials. Keep
# them in deployment secrets rather than writing them literally in this file.
go2rtc_username: "${CAMERA_AUDIT_GO2RTC_USERNAME}"
go2rtc_password: "${CAMERA_AUDIT_GO2RTC_PASSWORD}"
database: "/data/audit.db"
# IANA timezone used by the human dashboard and CSV export. SQLite and JSON
# API timestamps remain UTC. Examples: UTC, Asia/Yerevan, Europe/Berlin.
timezone: "UTC"

identity_header: "X-authentik-username"
trusted_proxies:
  - "172.18.0.0/16"

# Timing values must all be greater than zero.
poll_interval: 2s
# Inactivity timeout for authenticated Frigate sessions and historical
# recording_playback audit leases. Playback never activates privacy alerts.
activity_window: 5m
snapshot_lease: 75s
privacy_clear_delay: 30s
retention: 8760h # 365 days

# Optional fallback used only when the proxied Frigate /ws control channel has
# not supplied a live birdseye_layout. Current Frigate versions normally make
# this unnecessary. List every possible Birdseye camera when using the fallback.
birdseye_cameras: []
# birdseye_cameras:
#   - workshop
#   - electronics_room

# First matching rule wins. Suppressed connections are retained in history but
# do not activate room privacy alerts.
rules:
  - name: frigate-internal
    stream: "*"
    user_agent: "(?i)(FFmpeg Frigate|frigate/ffmpeg)"
    actor: "Frigate"
    actor_type: service
    suppressed: true

  # To prevent User-Agent spoofing for Frigate:
  # - name: frigate-internal-ipv4
  #   stream: "*"
  #   remote_cidr: "127.0.0.0/8"
  #   user_agent: "(?i)(FFmpeg Frigate|frigate/ffmpeg)"
  #   actor: "Frigate"
  #   actor_type: service
  #   suppressed: true
  # - name: frigate-internal-ipv6
  #   stream: "*"
  #   remote_cidr: "::1/128"
  #   user_agent: "(?i)(FFmpeg Frigate|frigate/ffmpeg)"
  #   actor: "Frigate"
  #   actor_type: service
  #   suppressed: true

  # Replace this documentation address with the snapshotter's actual address.
  # - name: safe-unlocked-snapshotter
  #   stream: "*"
  #   remote_cidr: "192.0.2.10/32"
  #   actor: "safe unlocked snapshotter"
  #   actor_type: service
  #   suppressed: true

  # Add a non-suppressed rule for the actual Home Assistant address when HA
  # opens RTSP/HLS streams directly and its FFmpeg user-agent is not distinctive:
  # - name: home-assistant
  #   remote_cidr: "192.168.1.20/32"
  #   actor: "Home Assistant"
  #   actor_type: service
  #   suppressed: false

mqtt:
  enabled: true
  broker: "tcp://mosquitto:1883"
  client_id: "camera-audit"
  username: "${CAMERA_AUDIT_MQTT_USERNAME}"
  password: "${CAMERA_AUDIT_MQTT_PASSWORD}"
  topic_prefix: "camera_audit"
  discovery_prefix: "homeassistant"
  # The MQTT account must be allowed to subscribe to
  # camera_audit/+/viewer so stale retained ON states can be cleared.

# Optional immediate notifications for recording playback, export requests,
# export downloads, and direct recording downloads. The first action sends a
# message immediately; further actions within batch_window edit that message.
# A playback's many HLS/segment requests are already one audit lease.
telegram:
  enabled: false
  bot_token: "${CAMERA_AUDIT_TELEGRAM_BOT_TOKEN}"
  chat_id: "${CAMERA_AUDIT_TELEGRAM_CHAT_ID}"
  batch_window: 5m
