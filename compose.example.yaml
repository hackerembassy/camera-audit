services:
  camera-audit:
    build: .
    restart: unless-stopped
    networks:
      - frigate
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
    environment:
      CAMERA_AUDIT_GO2RTC_USERNAME: "${CAMERA_AUDIT_GO2RTC_USERNAME}"
      CAMERA_AUDIT_GO2RTC_PASSWORD: "${CAMERA_AUDIT_GO2RTC_PASSWORD}"
      CAMERA_AUDIT_MQTT_USERNAME: "${CAMERA_AUDIT_MQTT_USERNAME}"
      CAMERA_AUDIT_MQTT_PASSWORD: "${CAMERA_AUDIT_MQTT_PASSWORD}"
    # Do not publish this port directly. Point the Authentik proxy provider at
    # http://camera-audit:8080 instead.

networks:
  frigate:
    external: true
